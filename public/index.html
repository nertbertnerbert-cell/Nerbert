<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERBERT AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  width: 100%;
  max-width: 650px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px;
  background: #111116;
  border-bottom: 1px solid #292932;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  color: #999;
  font-size: 13px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 85%;
  margin-bottom: 15px;
  padding: 13px 15px;
  border-radius: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.bot {
  background: #191920;
  margin-right: auto;
}

.user {
  background: #30303b;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #111116;
  border-top: 1px solid #292932;
}

input {
  flex: 1;
  padding: 14px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: #202027;
  color: white;
  font-size: 16px;
}

button {
  width: 55px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-size: 20px;
}

.status {
  font-size: 11px;
  color: #777;
  padding: 0 20px 8px;
}
</style>
</head>


<body>

<div class="app">


<div id="planBadge" class="plan-badge">
  <span>FREE</span>
</div>

<header class="topbar">
    <div class="brand">
      <div class="brand-icon">N</div>
      <div>
        <h1>NERBERT AI</h1>
        <p>Your personal AI assistant</p>
      </div>
    </div>

    <button class="settings-button" onclick="showSettings()">⚙️</button>
  </header>

  <main>

    <section class="welcome">
      <p class="eyebrow">PERSONAL AI</p>
      <h2>Welcome back, <span id="welcomeName">Nerbert</span>.</h2>
      <p>What would you like me to help you with?</p>
    </section>

    <section class="quick-actions">

      <button class="action-card pro-card" onclick="showUpgrade()">
        <span class="action-icon">⭐</span>
        <strong>NERBERT Pro</strong>
        <small>Unlock more AI features</small>
      </button>



      <button class="action-card" onclick="quickAction('Search the web for latest technology')">
        <span class="action-icon">🌐</span>
        <strong>Web Search</strong>
        <small>Find information online</small>
      </button>

      <button class="action-card" onclick="quickAction('What is the weather')">
        <span class="action-icon">🌦️</span>
        <strong>Weather</strong>
        <small>Check current weather</small>
      </button>

      <button class="action-card" onclick="showMemory()">
        <span class="action-icon">🧠</span>
        <strong>Memory</strong>
        <small>What NERBERT remembers</small>
      </button>

      <button class="action-card" onclick="showProjects()">
        <span class="action-icon">📁</span>
        <strong>Projects</strong>
        <small>Manage your projects</small>
      </button>

    </section>

    <section class="chat-section">

      <div class="section-title">
        <div>
          <h3>Conversation</h3>
          <span class="online-dot">● Online</span>
        </div>

        <button class="clear-button" onclick="clearChat()">
          Clear
        </button>
      </div>

      <div id="messages"></div>

    </section>

  </main>

  <div class="status">
    <span>🧠</span>
    <div>
      <strong>NERBERT is online</strong>
      <small>Memory • Web • Weather • Projects</small>
    </div>
  </div>

  <div class="input-area">

    <button id="voiceButton" class="voice-button">🎤</button>

    <input
      id="messageInput"
      type="text"
      placeholder="Ask NERBERT anything..."
      autocomplete="off"
    >

    <button id="sendButton" class="send-button">➤</button>

  </div>

</div>

<div id="overlay" class="overlay" onclick="closePanel(event)">
  <div id="panel" class="panel" onclick="event.stopPropagation()"></div>
</div>

<script>

function quickAction(text) {
  input.value = text;
  sendMessage();
}

function clearChat() {
  messages.innerHTML = "";
  addMessage(
    "Hello " + userProfile.name + ". 👋\n\nI'm ready to help.",
    "bot"
  );
}

async function showMemory() {
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>🧠 Memory</h2>
      <button onclick="hidePanel()">✕</button>
    </div>
    <p>Things NERBERT remembers about you.</p>
    <div id="memoryContent">Loading...</div>
  `;

  overlay.classList.add("active");

  try {
    const response = await fetch(
      API_BASE + "/api/memory"
    );

    const data = await response.json();
    const memories = data.memories || [];

    document.getElementById("memoryContent").innerHTML =
      memories.length
        ? memories.map(m =>
            `<div class="panel-item">
              <strong>${escapeHtml(m.category || "Memory")}</strong>
              <p>${escapeHtml(m.content || "")}</p>
            </div>`
          ).join("")
        : `<div class="empty-state">
             🧠 No memories yet.
           </div>`;

  } catch (error) {
    document.getElementById("memoryContent").textContent =
      "Unable to load memory.";
  }
}

async function showProjects() {
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>📁 Projects</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <button class="primary-button" onclick="createNewProject()">
      + New Project
    </button>

    <div id="projectsContent">Loading...</div>
  `;

  overlay.classList.add("active");

  await loadProjects();
}

async function loadProjects() {
  const content = document.getElementById("projectsContent");

  try {
    const response = await fetch(
      API_BASE + "/api/projects"
    );

    const data = await response.json();
    const projects = data.projects || [];

    content.innerHTML =
      projects.length
        ? projects.map(project =>
            `<div class="panel-item">
              <strong>${escapeHtml(project.name)}</strong>
              <p>${escapeHtml(project.description || "")}</p>
            </div>`
          ).join("")
        : `<div class="empty-state">
             📁 No projects yet.
           </div>`;

  } catch (error) {
    content.textContent = "Unable to load projects.";
  }
}

async function createNewProject() {
  const name = prompt("Project name:");

  if (!name || !name.trim()) {
    return;
  }

  const description =
    prompt("Project description:") || "";

  try {
    const response = await fetch(
      API_BASE + "/api/projects",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: name.trim(),
          description: description.trim()
        })
      }
    );

    if (!response.ok) {
      throw new Error("Project creation failed");
    }

    await loadProjects();

  } catch (error) {
    alert("Could not create project.");
  }
}


function showUpgrade() {

  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>⭐ NERBERT Pro</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="pro-hero">
      <div class="pro-icon">⭐</div>
      <h3>Unlock NERBERT Pro</h3>
      <p>Take your personal AI assistant further.</p>
    </div>

    <div class="pro-features">

      <div class="panel-item">
        <strong>🧠 Advanced Memory</strong>
        <p>Keep more useful information across conversations.</p>
      </div>

      <div class="panel-item">
        <strong>🌐 Advanced Web Tools</strong>
        <p>Search and explore information more efficiently.</p>
      </div>

      <div class="panel-item">
        <strong>📁 Unlimited Projects</strong>
        <p>Organize your work and ideas in one place.</p>
      </div>

      <div class="panel-item">
        <strong>🚀 Priority AI Features</strong>
        <p>Access future NERBERT capabilities first.</p>
      </div>

    </div>

    <button class="primary-button" onclick="showComingSoon()">
      ⭐ Upgrade to Pro
    </button>

    <small class="upgrade-note">
      Payments will be connected in a future release.
    </small>
  `;

  overlay.classList.add("active");
}

function showComingSoon() {

  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>🚀 Coming Soon</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="empty-state">
      <span>⭐</span>
      <p>
        NERBERT Pro subscriptions are coming soon.
      </p>
      <p>
        Your account will be able to upgrade here
        once billing is connected.
      </p>
    </div>

    <button class="primary-button" onclick="hidePanel()">
      Continue with Free
    </button>
  `;

}

function showSettings() {
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>⚙️ Settings</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="settings-card">
      <span>👤</span>
      <div>
        <strong>Profile</strong>
        <p>${escapeHtml(userProfile.name || "User")}</p>
      </div>
    </div>

    <div class="settings-card">
      <span>🧠</span>
      <div>
        <strong>Memory</strong>
        <p>Online</p>
      </div>
    </div>

    <div class="settings-card">
      <span>🌐</span>
      <div>
        <strong>Web Search</strong>
        <p>Online</p>
      </div>
    </div>

    <div class="settings-card">
      <span>🤖</span>
      <div>
        <strong>AI Mode</strong>
        <p>Local Mode</p>
      </div>
    </div>
  `;

  overlay.classList.add("active");
}

function hidePanel() {
  document.getElementById("overlay").classList.remove("active");
}

function closePanel(event) {
  if (event.target.id === "overlay") {
    hidePanel();
  }
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");
const voiceButton = document.getElementById("voiceButton");

const API_BASE = "http://127.0.0.1:3000";

let userProfile = {
  name: "User"
};



/* DASHBOARD CONTROLS */

function focusChat() {
  input.focus();

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

function runTool(tool) {

  if (tool === "search") {
    input.value = "Search the web for ";
    input.focus();
    return;
  }

  if (tool === "weather") {
    input.value = "What is the weather";
    sendMessage();
    return;
  }

  if (tool === "memory") {
    showMemory();
    return;
  }

  if (tool === "projects") {
    showProjects();
    return;
  }
}


function clearRecent() {

  const recent =
    document.getElementById("recentActivity");

  if (recent) {

    recent.innerHTML = `
      <div class="empty-state">
        <span>✨</span>
        <p>Your recent conversations will appear here.</p>
      </div>
    `;

  }

}


/* PROFILE */

async function loadProfile() {

  try {

    const response = await fetch("/api/profile");

    if (response.ok) {
      userProfile = await response.json();

      const welcomeName =
        document.getElementById("welcomeName");

      if (welcomeName) {
        welcomeName.textContent =
          userProfile.name || "User";
      }
    }

  } catch (error) {

    console.error("Profile error:", error);

  }

}


/* MESSAGE */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;

  return message;

}


/* MEMORY */

async function saveConversation(role, message) {

  try {

    await fetch("/api/memory/conversation", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        role: role,
        message: message
      })

    });

  } catch (error) {

    console.error("Memory error:", error);

  }

}


/* HISTORY */

async function loadHistory() {

  try {

    const response =
      await fetch("/api/memory/conversations");

    const data = await response.json();

    if (
      !data.conversations ||
      data.conversations.length === 0
    ) {

      addMessage(
        "Hello " +
        userProfile.name +
        ". I'm NERBERT AI. 🧠\n\n" +
        "Local Mode is active and my memory is online.",
        "bot"
      );

      return;

    }

    addMessage(
      "Welcome back, " +
      userProfile.name +
      ". 🧠",
      "bot"
    );

    data.conversations.forEach(item => {

      addMessage(
        item.message,
        item.role === "user"
          ? "user"
          : "bot"
      );

    });

  } catch (error) {

    console.error("History error:", error);

    addMessage(
      "Hello " +
      userProfile.name +
      ". I'm NERBERT AI.",
      "bot"
    );

  }

}


/* SPEECH OUTPUT */

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";
  speech.rate = 1;
  speech.pitch = 1;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);

}


/* CHAT */

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const thinking = document.createElement("div");
  thinking.className = "message bot";
  thinking.textContent = "Thinking...";
  messages.appendChild(thinking);

  const lower = text.toLowerCase();

  try {

    /* 🌐 WEB SEARCH */

    if (
      lower.startsWith("search ") ||
      lower.startsWith("search the web") ||
      lower.includes("search the web for") ||
      lower.includes("look up ")
    ) {

      let query = text
        .replace(/search the web for/i, "")
        .replace(/search the web/i, "")
        .replace(/^search/i, "")
        .replace(/look up/i, "")
        .trim();

      if (!query) {
        thinking.textContent =
          "What would you like me to search for?";
        return;
      }

      thinking.textContent = "🌐 Searching the web...";

      const response = await fetch(
        API_BASE + "/api/search?q=" +
        encodeURIComponent(query)
      );

      const data = await response.json();

      if (!response.ok || !data.results) {
        throw new Error(
          data.error || "Search failed"
        );
      }

      if (data.results.length === 0) {
        thinking.textContent =
          "🌐 I couldn't find any results for: " +
          query;
        return;
      }

      let output =
        "🌐 Search results for: " +
        query +
        "\n\n";

      data.results.forEach((result, index) => {

        output +=
          `${index + 1}. ${result.title}\n`;

        if (result.description) {
          output +=
            `${result.description}\n`;
        }

        output +=
          `${result.url}\n\n`;

      });

      thinking.textContent = output;

      return;
    }

    /* 🌦️ WEATHER */

    if (
      lower.includes("weather") ||
      lower.includes("temperature")
    ) {

      thinking.textContent =
        "🌦️ Checking the weather...";

      const response = await fetch(
        API_BASE + "/api/weather?city=Lusaka"
      );

      const weather = await response.json();

      thinking.textContent =
        "🌦️ Weather in " +
        (weather.city || "Lusaka") +
        "\n\n" +
        "🌡️ Temperature: " +
        (weather.temperature ?? "unknown") +
        "°C\n" +
        "🌡️ Feels like: " +
        (weather.feelsLike ?? "unknown") +
        "°C\n" +
        "💧 Humidity: " +
        (weather.humidity ?? "unknown") +
        "%\n" +
        "💨 Wind: " +
        (weather.wind ?? "unknown") +
        " km/h\n" +
        "☀️ " +
        (weather.description || "Unknown");

      return;
    }

    /* 🧠 NORMAL CHAT */

    const response = await fetch(
      API_BASE + "/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      }
    );

    const data = await response.json();

    thinking.textContent =
      data.reply ||
      "NERBERT couldn't generate a response.";

  } catch (error) {

    console.error(error);

    thinking.textContent =
      "⚠️ NERBERT couldn't complete that request.";

  }
}



/* ENTER KEY */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


/* SEND BUTTON */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* VOICE INPUT */

let recognition = null;

if ("webkitSpeechRecognition" in window) {

  recognition =
    new webkitSpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onstart = function() {

    voiceButton.textContent = "🔴";

  };

  recognition.onend = function() {

    voiceButton.textContent = "🎤";

  };

  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    input.value = transcript;

    sendMessage();

  };

  recognition.onerror = function(event) {

    console.log(
      "Voice error:",
      event.error
    );

    voiceButton.textContent = "🎤";

  };

  voiceButton.addEventListener(
    "click",
    function() {

      recognition.start();

    }
  );

} else {

  voiceButton.addEventListener(
    "click",
    function() {

      alert(
        "Voice recognition is not supported by this browser."
      );

    }
  );

}


/* START */

async function startNERBERT() {

  await loadProfile();

  await loadHistory();

}

startNERBERT();

</script>

</body>
</html>
