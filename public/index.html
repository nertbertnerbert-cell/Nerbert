<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERBERT AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  width: 100%;
  max-width: 650px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px;
  background: #111116;
  border-bottom: 1px solid #292932;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  color: #999;
  font-size: 13px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 85%;
  margin-bottom: 15px;
  padding: 13px 15px;
  border-radius: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.bot {
  background: #191920;
  margin-right: auto;
}

.user {
  background: #30303b;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #111116;
  border-top: 1px solid #292932;
}

input {
  flex: 1;
  padding: 14px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: #202027;
  color: white;
  font-size: 16px;
}

button {
  width: 55px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-size: 20px;
}

.status {
  font-size: 11px;
  color: #777;
  padding: 0 20px 8px;
}

/* NERBERT PLAN + USAGE */

.plan-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  background: #202027;
  color: #aaa;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
}

.plan-badge.pro {
  color: #fff;
}

.usage-card {
  margin: 16px 0;
  padding: 18px;
  border: 1px solid #292932;
  border-radius: 18px;
  background: #15151c;
}

.usage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.usage-header small {
  display: block;
  color: #777;
  font-size: 10px;
  letter-spacing: 1px;
}

.usage-header h3 {
  margin: 4px 0 0;
  font-size: 18px;
}

.usage-header > span {
  font-size: 22px;
}

.usage-row {
  margin-bottom: 16px;
}

.usage-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
  font-size: 13px;
}

.usage-label strong {
  color: #aaa;
  font-size: 12px;
}

.usage-bar {
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: #292932;
}

.usage-fill {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: #fff;
  transition: width .35s ease;
}

.usage-card .primary-button {
  width: 100%;
  margin-top: 4px;
}


/* ================================
   NERBERT MODAL / PANEL SYSTEM
   ================================ */

body.modal-open {
  overflow: hidden;
}

.overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  box-sizing: border-box;
  background: rgba(0, 0, 0, 0.82);
  z-index: 99999;
  isolation: isolate;
}

.overlay.active {
  display: flex;
}

.panel {
  position: relative;
  z-index: 100000;
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow-x: hidden;
  overflow-y: auto;
  box-sizing: border-box;
  padding: 22px;
  background: #111116;
  color: white;
  border: 1px solid #34343f;
  border-radius: 20px;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.75);
}

.panel-header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 15px;
  margin-bottom: 18px;
  background: #111116;
  border-bottom: 1px solid #292932;
}

.panel-header h2 {
  margin: 0;
  font-size: 22px;
}

.panel-header button {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border-radius: 12px;
  background: #24242d;
  color: white;
  cursor: pointer;
}

.panel-item {
  padding: 15px;
  margin-bottom: 12px;
  background: #191920;
  border: 1px solid #292932;
  border-radius: 14px;
}

.panel-item strong {
  display: block;
  margin-bottom: 5px;
}

.panel-item p {
  margin: 0;
  color: #aaa;
  line-height: 1.45;
}

.pro-hero {
  text-align: center;
  padding: 10px 0 20px;
}

.pro-icon {
  font-size: 42px;
  margin-bottom: 8px;
}

.pro-hero h3 {
  margin: 5px 0 8px;
  font-size: 22px;
}

.pro-hero p {
  margin: 0;
  color: #aaa;
}

.pro-features {
  margin-top: 10px;
}

.primary-button {
  width: 100%;
  min-height: 48px;
  margin-top: 12px;
  padding: 12px 16px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

.upgrade-note {
  display: block;
  margin-top: 12px;
  text-align: center;
  color: #777;
  line-height: 1.4;
}

.quick-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.action-card {
  width: 100%;
  min-width: 0;
  min-height: 105px;
  padding: 14px;
  box-sizing: border-box;
  text-align: left;
  overflow: hidden;
}

.action-card strong,
.action-card small {
  display: block;
  overflow-wrap: anywhere;
}

.action-card small {
  margin-top: 5px;
  color: #999;
  line-height: 1.3;
}

.chat-section {
  position: relative;
  z-index: 1;
}

.input-area {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  box-sizing: border-box;
}

@media (max-width: 380px) {
  .quick-actions {
    grid-template-columns: 1fr;
  }

  .panel {
    padding: 18px;
    border-radius: 16px;
  }

  .overlay {
    padding: 12px;
  }
}

</style>
</head>


<body>

<div class="app">


<div id="planBadge" class="plan-badge">
  <span>FREE</span>
</div>

<header class="topbar">
    <div class="brand">
      <div class="brand-icon">N</div>
      <div>
        <h1>NERBERT AI</h1>
        <p>Your personal AI assistant</p>
      </div>
    </div>

    <button class="settings-button" onclick="showSettings()">⚙️</button>
  </header>

  <main>

    <section class="welcome">
      <p class="eyebrow">PERSONAL AI</p>
      <h2>Welcome back, <span id="welcomeName">Nerbert</span>.</h2>
      <p>What would you like me to help you with?</p>
    </section>

    
<section class="usage-card">

  <div class="usage-header">
    <div>
      <small>YOUR PLAN</small>
      <h3 id="usagePlan">FREE</h3>
    </div>

    <span id="usagePlanIcon">⭐</span>
  </div>

  <div class="usage-row">

    <div class="usage-label">
      <span>📁 Projects</span>
      <strong id="projectsUsage">0 / 3</strong>
    </div>

    <div class="usage-bar">
      <div
        id="projectsUsageBar"
        class="usage-fill">
      </div>
    </div>

  </div>

  <div class="usage-row">

    <div class="usage-label">
      <span>🧠 Memory</span>
      <strong id="memoryUsage">0 / 20</strong>
    </div>

    <div class="usage-bar">
      <div
        id="memoryUsageBar"
        class="usage-fill">
      </div>
    </div>

  </div>

  <button
    id="usageUpgradeButton"
    class="primary-button"
    onclick="showUpgrade()">
    ⭐ Upgrade to Pro
  </button>

</section>

<section class="quick-actions">

      <button class="action-card pro-card" onclick="showUpgrade()">
        <span class="action-icon">⭐</span>
        <strong>NERBERT Pro</strong>
        <small>Unlock more AI features</small>
      </button>



      <button class="action-card" onclick="quickAction('Search the web for latest technology')">
        <span class="action-icon">🌐</span>
        <strong>Web Search</strong>
        <small>Find information online</small>
      </button>

      <button class="action-card" onclick="quickAction('What is the weather')">
        <span class="action-icon">🌦️</span>
        <strong>Weather</strong>
        <small>Check current weather</small>
      </button>

      <button class="action-card" onclick="showMemory()">
        <span class="action-icon">🧠</span>
        <strong>Memory</strong>
        <small>What NERBERT remembers</small>
      </button>

      <button class="action-card" onclick="showProjects()">
        <span class="action-icon">📁</span>
        <strong>Projects</strong>
        <small>Manage your projects</small>
      </button>

    </section>

    <section class="chat-section">

      <div class="section-title">
        <div>
          <h3>Conversation</h3>
          <span class="online-dot">● Online</span>
        </div>

        <button class="clear-button" onclick="clearChat()">
          Clear
        </button>
      </div>

      <div id="messages"></div>

    </section>

  </main>

  <div class="status">
    <span>🧠</span>
    <div>
      <strong>NERBERT is online</strong>
      <small>Memory • Web • Weather • Projects</small>
    </div>
  </div>

  <div class="input-area">

    <button id="voiceButton" class="voice-button">🎤</button>

    <input
      id="messageInput"
      type="text"
      placeholder="Ask NERBERT anything..."
      autocomplete="off"
    >

    <button id="sendButton" class="send-button">➤</button>

  </div>

</div>

<div id="overlay" class="overlay" onclick="closePanel(event)">
  <div id="panel" class="panel" onclick="event.stopPropagation()"></div>
</div>

<script>

function quickAction(text) {
  input.value = text;
  sendMessage();
}

function clearChat() {
  messages.innerHTML = "";
  addMessage(
    "Hello " + userProfile.name + ". 👋\n\nI'm ready to help.",
    "bot"
  );
}

async function showMemory() {

  const overlay =
    document.getElementById("overlay");

  const panel =
    document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>🧠 Memory</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <p>
      Things NERBERT remembers about you.
    </p>

    <div class="memory-form">

      <input
        id="memoryCategory"
        type="text"
        placeholder="Category (e.g. preference)"
      >

      <textarea
        id="memoryContent"
        placeholder="What should NERBERT remember?"
        rows="3"
      ></textarea>

      <button
        class="primary-button"
        onclick="saveNewMemory()">
        🧠 Save Memory
      </button>

    </div>

    <div id="memoryList">
      Loading...
    </div>
  `;

  overlay.classList.add("active");
  document.body.classList.add("modal-open");

  await loadMemoryList();
}


async function loadMemoryList() {

  const list =
    document.getElementById("memoryList");

  if (!list) return;

  try {

    const response =
      await fetch(
        API_BASE + "/api/memory"
      );

    const data =
      await response.json();

    const memories =
      data.memories || [];

    list.innerHTML =
      memories.length
        ? memories.map(memory => `
            <div class="panel-item">

              <strong>
                ${escapeHtml(
                  memory.category || "Memory"
                )}
              </strong>

              <p>
                ${escapeHtml(
                  memory.content || ""
                )}
              </p>

            </div>
          `).join("")
        : `
          <div class="empty-state">
            🧠 No memories yet.
          </div>
        `;

  } catch (error) {

    console.error(
      "Memory loading error:",
      error
    );

    list.textContent =
      "Unable to load memories.";
  }
}


async function saveNewMemory() {

  const categoryInput =
    document.getElementById("memoryCategory");

  const contentInput =
    document.getElementById("memoryContent");

  const category =
    String(
      categoryInput?.value || "general"
    ).trim();

  const content =
    String(
      contentInput?.value || ""
    ).trim();

  if (!content) {

    alert(
      "Enter something for NERBERT to remember."
    );

    return;
  }

  try {

    const response =
      await fetch(
        API_BASE + "/api/memory",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            category,
            content
          })
        }
      );

    const data =
      await response.json();

    if (
      response.status === 403 &&
      data.code === "PRO_REQUIRED"
    ) {

      showMemoryUpgrade(data);

      return;
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Could not save memory."
      );
    }

    if (contentInput) {
      contentInput.value = "";
    }

    await loadMemoryList();

  } catch (error) {

    console.error(
      "Memory save error:",
      error
    );

    alert(
      "Could not save memory."
    );
  }
}


function showMemoryUpgrade(data) {

  const overlay =
    document.getElementById("overlay");

  const panel =
    document.getElementById("panel");

  const limit =
    data?.limit || 20;

  panel.innerHTML = `
    <div class="panel-header">
      <h2>⭐ NERBERT Pro</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="pro-hero">

      <div class="pro-icon">🧠</div>

      <h3>You've reached the Free memory limit</h3>

      <p>
        Free accounts can save up to
        ${limit} memories.
      </p>

      <p>
        Upgrade to NERBERT Pro for
        expanded memory.
      </p>

    </div>

    <div class="panel-item">

      <strong>🧠 Advanced Memory</strong>

      <p>
        Keep more useful information
        across your NERBERT conversations.
      </p>

    </div>

    <button
      class="primary-button"
      onclick="hidePanel(); showUpgrade()">
      ⭐ Upgrade to Pro
    </button>

    <button
      class="clear-button"
      onclick="hidePanel()">
      Continue with Free
    </button>
  `;

  overlay.classList.add("active");
  document.body.classList.add("modal-open");
}


async function showProjects() {
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>📁 Projects</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <button class="primary-button" onclick="createNewProject()">
      + New Project
    </button>

    <div id="projectsContent">Loading...</div>
  `;

  overlay.classList.add("active");
  document.body.classList.add("modal-open");

  await loadProjects();
}

async function loadProjects() {
  const content = document.getElementById("projectsContent");

  try {
    const response = await fetch(
      API_BASE + "/api/projects"
    );

    const data = await response.json();
    const projects = data.projects || [];

    content.innerHTML =
      projects.length
        ? projects.map(project =>
            `<div class="panel-item">
              <strong>${escapeHtml(project.name)}</strong>
              <p>${escapeHtml(project.description || "")}</p>
            </div>`
          ).join("")
        : `<div class="empty-state">
             📁 No projects yet.
           </div>`;

  } catch (error) {
    content.textContent = "Unable to load projects.";
  }
}

async function createNewProject() {

  const name = prompt("Project name:");

  if (!name || !name.trim()) {
    return;
  }

  const description =
    prompt("Project description:") || "";

  try {

    const response = await fetch(
      API_BASE + "/api/projects",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: name.trim(),
          description: description.trim()
        })
      }
    );

    const data = await response.json();

    if (response.status === 403 &&
        data.code === "PRO_REQUIRED") {

      showProjectUpgrade(data);
      return;
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Project creation failed"
      );
    }

    await loadProjects();

  } catch (error) {

    console.error(
      "Project creation error:",
      error
    );

    alert(
      "Could not create project."
    );
  }
}


function showProjectUpgrade(data) {

  const overlay =
    document.getElementById("overlay");

  const panel =
    document.getElementById("panel");

  const limit =
    data?.limit || 3;

  panel.innerHTML = `
    <div class="panel-header">
      <h2>⭐ NERBERT Pro</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="pro-hero">

      <div class="pro-icon">📁</div>

      <h3>You've reached the Free limit</h3>

      <p>
        Free accounts can create up to
        ${limit} projects.
      </p>

      <p>
        Upgrade to NERBERT Pro for
        unlimited projects.
      </p>

    </div>

    <div class="panel-item">
      <strong>🚀 Unlimited Projects</strong>
      <p>
        Keep all your ideas, applications,
        stories and work organized in NERBERT.
      </p>
    </div>

    <button
      class="primary-button"
      onclick="hidePanel(); showUpgrade()">
      ⭐ Upgrade to Pro
    </button>

    <button
      class="clear-button"
      onclick="hidePanel()">
      Continue with Free
    </button>
  `;

  overlay.classList.add("active");
  document.body.classList.add("modal-open");
}


function showUpgrade() {

  const overlay =
    document.getElementById("overlay");

  const panel =
    document.getElementById("panel");

  const isPro =
    String(userProfile.plan || "free").toLowerCase() === "pro";

  if (isPro) {

    panel.innerHTML = `
      <div class="panel-header">
        <h2>⭐ NERBERT Pro</h2>
        <button onclick="hidePanel()">✕</button>
      </div>

      <div class="pro-hero">
        <div class="pro-icon">⭐</div>
        <h3>You're already Pro</h3>
        <p>Your NERBERT Pro features are active.</p>
      </div>

      <div class="pro-features">

        <div class="panel-item">
          <strong>🧠 Advanced Memory</strong>
          <p>Keep more useful information across conversations.</p>
        </div>

        <div class="panel-item">
          <strong>🌐 Advanced Web Tools</strong>
          <p>Search and explore information more efficiently.</p>
        </div>

        <div class="panel-item">
          <strong>📁 Unlimited Projects</strong>
          <p>Organize your work and ideas in one place.</p>
        </div>

        <div class="panel-item">
          <strong>🚀 Priority AI Features</strong>
          <p>Access future NERBERT capabilities first.</p>
        </div>

      </div>

      <button class="primary-button"
              onclick="hidePanel()">
        Continue with NERBERT Pro
      </button>
    `;

    overlay.classList.add("active");
  document.body.classList.add("modal-open");
    return;
  }

  panel.innerHTML = `
    <div class="panel-header">
      <h2>⭐ NERBERT Pro</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="pro-hero">
      <div class="pro-icon">⭐</div>
      <h3>Unlock NERBERT Pro</h3>
      <p>Take your personal AI assistant further.</p>
    </div>

    <div class="pro-features">

      <div class="panel-item">
        <strong>🧠 Advanced Memory</strong>
        <p>Keep more useful information across conversations.</p>
      </div>

      <div class="panel-item">
        <strong>🌐 Advanced Web Tools</strong>
        <p>Search and explore information more efficiently.</p>
      </div>

      <div class="panel-item">
        <strong>📁 Unlimited Projects</strong>
        <p>Organize your work and ideas in one place.</p>
      </div>

      <div class="panel-item">
        <strong>🚀 Priority AI Features</strong>
        <p>Access future NERBERT capabilities first.</p>
      </div>

    </div>

    <button class="primary-button"
            onclick="showComingSoon()">
      ⭐ Upgrade to Pro
    </button>

    <small class="upgrade-note">
      Payments will be connected in a future release.
    </small>
  `;

  overlay.classList.add("active");
  document.body.classList.add("modal-open");
}

function showComingSoon() {

  const panel =
    document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>🚀 Coming Soon</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="empty-state">
      <span>⭐</span>
      <p>
        NERBERT Pro subscriptions are coming soon.
      </p>
      <p>
        Your account will be able to upgrade here
        once billing is connected.
      </p>
    </div>

    <button class="primary-button"
            onclick="hidePanel()">
      Continue with Free
    </button>
  `;

}

function showSettings() {
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");

  panel.innerHTML = `
    <div class="panel-header">
      <h2>⚙️ Settings</h2>
      <button onclick="hidePanel()">✕</button>
    </div>

    <div class="settings-card">
      <span>👤</span>
      <div>
        <strong>Profile</strong>
        <p>${escapeHtml(userProfile.name || "User")}</p>
      </div>
    </div>

    <div class="settings-card">
      <span>🧠</span>
      <div>
        <strong>Memory</strong>
        <p>Online</p>
      </div>
    </div>

    <div class="settings-card">
      <span>🌐</span>
      <div>
        <strong>Web Search</strong>
        <p>Online</p>
      </div>
    </div>

    <div class="settings-card">
      <span>🤖</span>
      <div>
        <strong>AI Mode</strong>
        <p>Local Mode</p>
      </div>
    </div>
  `;

  overlay.classList.add("active");
  document.body.classList.add("modal-open");
}

function hidePanel() {

  const overlay =
    document.getElementById("overlay");

  overlay.classList.remove("active");

  document.body.classList.remove("modal-open");
}



function closePanel(event) {
  if (event.target.id === "overlay") {
    hidePanel();
  }
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");
const voiceButton = document.getElementById("voiceButton");

const API_BASE = "http://127.0.0.1:3000";

let userProfile = {
  name: "User"
};



/* DASHBOARD CONTROLS */

function focusChat() {
  input.focus();

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

function runTool(tool) {

  if (tool === "search") {
    input.value = "Search the web for ";
    input.focus();
    return;
  }

  if (tool === "weather") {
    input.value = "What is the weather";
    sendMessage();
    return;
  }

  if (tool === "memory") {
    showMemory();
    return;
  }

  if (tool === "projects") {
    showProjects();
    return;
  }
}


function clearRecent() {

  const recent =
    document.getElementById("recentActivity");

  if (recent) {

    recent.innerHTML = `
      <div class="empty-state">
        <span>✨</span>
        <p>Your recent conversations will appear here.</p>
      </div>
    `;

  }

}


/* PROFILE */


function updatePlanBadge(plan) {

  const badge =
    document.getElementById("planBadge");

  if (!badge) return;

  const normalized =
    String(plan || "free").toLowerCase();

  if (normalized === "pro") {

    badge.innerHTML = "<span>⭐ PRO</span>";
    badge.classList.add("pro");

  } else {

    badge.innerHTML = "<span>FREE</span>";
    badge.classList.remove("pro");

  }

}


async function loadUsage() {

  try {

    const response =
      await fetch(
        API_BASE + "/api/usage"
      );

    if (!response.ok) {
      throw new Error(
        "Usage request failed"
      );
    }

    const data =
      await response.json();

    const isPro =
      data.pro === true ||
      data.plan === "pro";

    const plan =
      document.getElementById(
        "usagePlan"
      );

    const icon =
      document.getElementById(
        "usagePlanIcon"
      );

    const projects =
      document.getElementById(
        "projectsUsage"
      );

    const memories =
      document.getElementById(
        "memoryUsage"
      );

    const projectsBar =
      document.getElementById(
        "projectsUsageBar"
      );

    const memoryBar =
      document.getElementById(
        "memoryUsageBar"
      );

    const upgrade =
      document.getElementById(
        "usageUpgradeButton"
      );

    if (isPro) {

      if (plan)
        plan.textContent = "PRO";

      if (icon)
        icon.textContent = "⭐";

      if (projects)
        projects.textContent = "Unlimited";

      if (memories)
        memories.textContent = "Unlimited";

      if (projectsBar)
        projectsBar.style.width = "100%";

      if (memoryBar)
        memoryBar.style.width = "100%";

      if (upgrade)
        upgrade.style.display = "none";

    } else {

      if (plan)
        plan.textContent = "FREE";

      if (icon)
        icon.textContent = "⭐";

      const projectLimit =
        data.projects.limit || 3;

      const memoryLimit =
        data.memories.limit || 20;

      const projectUsed =
        data.projects.used || 0;

      const memoryUsed =
        data.memories.used || 0;

      if (projects) {

        projects.textContent =
          projectUsed +
          " / " +
          projectLimit;

      }

      if (memories) {

        memories.textContent =
          memoryUsed +
          " / " +
          memoryLimit;

      }

      if (projectsBar) {

        projectsBar.style.width =
          Math.min(
            100,
            (projectUsed / projectLimit) * 100
          ) + "%";

      }

      if (memoryBar) {

        memoryBar.style.width =
          Math.min(
            100,
            (memoryUsed / memoryLimit) * 100
          ) + "%";

      }

      if (upgrade)
        upgrade.style.display = "block";

    }

  } catch (error) {

    console.error(
      "Usage error:",
      error
    );

  }

}


async function loadProfile() {

  try {

    const response = await fetch("/api/profile");

    if (response.ok) {

      userProfile = await response.json();

      updatePlanBadge(
        userProfile.plan || "free"
      );

      const welcomeName =
        document.getElementById("welcomeName");

      if (welcomeName) {
        welcomeName.textContent =
          userProfile.name || "User";
      }
    }

  } catch (error) {

    console.error("Profile error:", error);

  }

}


/* MESSAGE */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;

  return message;

}


/* MEMORY */

async function saveConversation(role, message) {

  try {

    await fetch("/api/memory/conversation", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        role: role,
        message: message
      })

    });

  } catch (error) {

    console.error("Memory error:", error);

  }

}


/* HISTORY */

async function loadHistory() {

  try {

    const response =
      await fetch("/api/memory/conversations");

    const data = await response.json();

    if (
      !data.conversations ||
      data.conversations.length === 0
    ) {

      addMessage(
        "Hello " +
        userProfile.name +
        ". I'm NERBERT AI. 🧠\n\n" +
        "Local Mode is active and my memory is online.",
        "bot"
      );

      return;

    }

    addMessage(
      "Welcome back, " +
      userProfile.name +
      ". 🧠",
      "bot"
    );

    data.conversations.forEach(item => {

      addMessage(
        item.message,
        item.role === "user"
          ? "user"
          : "bot"
      );

    });

  } catch (error) {

    console.error("History error:", error);

    addMessage(
      "Hello " +
      userProfile.name +
      ". I'm NERBERT AI.",
      "bot"
    );

  }

}


/* SPEECH OUTPUT */

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";
  speech.rate = 1;
  speech.pitch = 1;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);

}


/* CHAT */

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const thinking = document.createElement("div");
  thinking.className = "message bot";
  thinking.textContent = "Thinking...";
  messages.appendChild(thinking);

  const lower = text.toLowerCase();

  try {

    /* 🌐 WEB SEARCH */

    if (
      lower.startsWith("search ") ||
      lower.startsWith("search the web") ||
      lower.includes("search the web for") ||
      lower.includes("look up ")
    ) {

      let query = text
        .replace(/search the web for/i, "")
        .replace(/search the web/i, "")
        .replace(/^search/i, "")
        .replace(/look up/i, "")
        .trim();

      if (!query) {
        thinking.textContent =
          "What would you like me to search for?";
        return;
      }

      thinking.textContent = "🌐 Searching the web...";

      const response = await fetch(
        API_BASE + "/api/search?q=" +
        encodeURIComponent(query)
      );

      const data = await response.json();

      if (!response.ok || !data.results) {
        throw new Error(
          data.error || "Search failed"
        );
      }

      if (data.results.length === 0) {
        thinking.textContent =
          "🌐 I couldn't find any results for: " +
          query;
        return;
      }

      let output =
        "🌐 Search results for: " +
        query +
        "\n\n";

      data.results.forEach((result, index) => {

        output +=
          `${index + 1}. ${result.title}\n`;

        if (result.description) {
          output +=
            `${result.description}\n`;
        }

        output +=
          `${result.url}\n\n`;

      });

      thinking.textContent = output;

      return;
    }

    /* 🌦️ WEATHER */

    if (
      lower.includes("weather") ||
      lower.includes("temperature")
    ) {

      thinking.textContent =
        "🌦️ Checking the weather...";

      const response = await fetch(
        API_BASE + "/api/weather?city=Lusaka"
      );

      const weather = await response.json();

      thinking.textContent =
        "🌦️ Weather in " +
        (weather.city || "Lusaka") +
        "\n\n" +
        "🌡️ Temperature: " +
        (weather.temperature ?? "unknown") +
        "°C\n" +
        "🌡️ Feels like: " +
        (weather.feelsLike ?? "unknown") +
        "°C\n" +
        "💧 Humidity: " +
        (weather.humidity ?? "unknown") +
        "%\n" +
        "💨 Wind: " +
        (weather.wind ?? "unknown") +
        " km/h\n" +
        "☀️ " +
        (weather.description || "Unknown");

      return;
    }

    /* 🧠 NORMAL CHAT */

    const response = await fetch(
      API_BASE + "/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      }
    );

    const data = await response.json();

    thinking.textContent =
      data.reply ||
      "NERBERT couldn't generate a response.";

  } catch (error) {

    console.error(error);

    thinking.textContent =
      "⚠️ NERBERT couldn't complete that request.";

  }
}



/* ENTER KEY */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


/* SEND BUTTON */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* VOICE INPUT */

let recognition = null;

if ("webkitSpeechRecognition" in window) {

  recognition =
    new webkitSpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onstart = function() {

    voiceButton.textContent = "🔴";

  };

  recognition.onend = function() {

    voiceButton.textContent = "🎤";

  };

  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    input.value = transcript;

    sendMessage();

  };

  recognition.onerror = function(event) {

    console.log(
      "Voice error:",
      event.error
    );

    voiceButton.textContent = "🎤";

  };

  voiceButton.addEventListener(
    "click",
    function() {

      recognition.start();

    }
  );

} else {

  voiceButton.addEventListener(
    "click",
    function() {

      alert(
        "Voice recognition is not supported by this browser."
      );

    }
  );

}


/* START */

async function startNERBERT() {

  await loadProfile();
loadUsage();

  await loadHistory();

}

startNERBERT();

</script>
