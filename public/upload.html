<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nerbert Music</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090909;
  color: white;
  padding-bottom: 150px;
}

header {
  padding: 32px 20px 24px;
  background: linear-gradient(180deg, #292929, #0b0b0b);
}

.logo {
  font-size: 30px;
  font-weight: 800;
}

.subtitle {
  color: #999;
  margin-top: 6px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.upload {
  background: linear-gradient(145deg, #202020, #141414);
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 22px;
  border: 1px solid #292929;
}

.upload h2 {
  margin-top: 0;
}

input[type="file"] {
  width: 100%;
  margin: 15px 0;
  color: #aaa;
}

.upload button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  background: white;
  color: black;
}

.search {
  width: 100%;
  padding: 15px;
  margin-bottom: 22px;
  border: 1px solid #292929;
  border-radius: 14px;
  background: #171717;
  color: white;
  font-size: 16px;
  outline: none;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.section-title h2 {
  margin: 0;
}

#songCount {
  color: #888;
  font-size: 14px;
}

#songs {
  margin-top: 15px;
}

.song {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #171717;
  padding: 13px;
  margin: 10px 0;
  border-radius: 17px;
  border: 1px solid #222;
  cursor: pointer;
}

.song.active {
  background: #292929;
}

.cover {
  width: 58px;
  height: 58px;
  border-radius: 12px;
  background: linear-gradient(135deg, #555, #111);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
}

.song-info {
  min-width: 0;
  flex: 1;
}

.song-name {
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-number {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

.favorite {
  border: none;
  background: transparent;
  color: white;
  font-size: 25px;
  padding: 5px;
}

.favorite.liked {
  color: #ff4d6d;
}

.empty {
  color: #777;
  text-align: center;
  padding: 35px 10px;
}

#message {
  color: #aaa;
  font-size: 14px;
}

/* PLAYER */

.bottom-player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(20,20,20,.97);
  border-top: 1px solid #333;
  padding: 12px 16px 18px;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.player-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.player-cover {
  width: 50px;
  height: 50px;
  border-radius: 11px;
  background: linear-gradient(135deg, #555, #111);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.player-title {
  flex: 1;
  overflow: hidden;
}

.player-title strong {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-title span {
  color: #888;
  font-size: 13px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
}

.controls button {
  border: none;
  background: transparent;
  color: white;
  font-size: 21px;
  padding: 7px 12px;
}

.controls .play {
  background: white;
  color: black;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 20px;
}

</style>
</head>

<body>

<header>
  <div class="logo">🎵 Nerbert Music</div>
  <div class="subtitle">Your music. Your library.</div>
</header>

<div class="container">

  <div class="upload">

    <h2>Add Music</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
      style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;background:#181818;color:white;font-size:16px;"
    >

    <input
      type="text"
      id="songArtist"
      placeholder="Artist"
      style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;background:#181818;color:white;font-size:16px;"
    >

    <input
      type="text"
      id="songAlbum"
      placeholder="Album"
      style="width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;background:#181818;color:white;font-size:16px;"
    >

    <input
      type="file"
      id="songFile"
      accept="audio/*"
      style="width:100%;padding:10px;margin:8px 0;color:#aaa;"
    >

    <button onclick="uploadSong()">
      ＋ Upload Song
    </button>

    <p id="message"></p>

  </div>

  <input
    class="search"
    type="search"
    id="search"
    placeholder="🔍 Search your songs..."
    oninput="searchSongs()"
  >

  <div class="section-title">
    <h2>Your Songs</h2>
    <span id="songCount"></span>
  </div>

  <div id="songs">
    Loading...
  </div>

</div>

<div class="bottom-player">

  <div class="player-info">

    <div class="player-cover">
      🎵
    </div>

    <div class="player-title">

      <strong id="playerTitle">
        Nothing playing
      </strong>

      <span>Nerbert Music</span>

    </div>

  </div>

 <div class="controls">

  <button
    id="shuffleButton"
    onclick="toggleShuffle()">
    🔀
  </button>

  <button onclick="previousSong()">⏮</button>

  <button
    class="play"
    id="playButton"
    onclick="togglePlay()">
    ▶
  </button>

  <button onclick="nextSong()">⏭</button>

  <button
    id="repeatButton"
    onclick="toggleRepeat()">
    🔁
  </button>

</div>
</div>

<script>

let songs = [];
let currentIndex = -1;
let shuffle = false;
let repeat = false;
const audio = new Audio();

let favorites = JSON.parse(
  localStorage.getItem("nerbertFavorites") || "[]"
);

audio.addEventListener("ended", () => {

  if (repeat) {
    playSong(currentIndex);
    return;
  }

  nextSong();
function toggleShuffle() {

  shuffle = !shuffle;

  document.getElementById("shuffleButton").style.opacity =
    shuffle ? "1" : "0.5";

}

function toggleRepeat() {

  repeat = !repeat;

  document.getElementById("repeatButton").style.opacity =
    repeat ? "1" : "0.5";

}
});

async function loadSongs() {

  try {

    const response = await fetch("/songs");

    songs = await response.json();

    const container =
      document.getElementById("songs");

    document.getElementById("songCount").textContent =
      songs.length +
      (songs.length === 1 ? " song" : " songs");

    if (songs.length === 0) {

      container.innerHTML =
        '<div class="empty">🎵<br><br>No songs yet.<br>Upload your first song.</div>';

      return;
    }

    container.innerHTML = "";

    songs.forEach((song, index) => {

      const div =
        document.createElement("div");

      div.className = "song";

      div.onclick = () =>
        playSong(index);

      div.innerHTML = `

        <div class="cover">
          🎵
        </div>

        <div class="song-info">

          <div class="song-name">
            ${escapeHtml(song.name)}
          </div>

          <div class="song-number">
            Artist • Nerbert Music
          </div>

        </div>

        <button
          class="favorite"
          onclick="event.stopPropagation(); toggleFavorite(${index})">
          ♡
        </button>
      `;

      const favoriteButton =
        div.querySelector(".favorite");

      if (favorites.includes(song.name)) {

        favoriteButton.textContent = "♥";

        favoriteButton.classList.add("liked");
      }

      container.appendChild(div);

    });

    highlightSong();

  } catch (error) {

    document.getElementById("songs").innerHTML =
      '<div class="empty">Unable to load songs.</div>';

  }

}

function searchSongs() {

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const items =
    document.querySelectorAll(".song");

  items.forEach((item, index) => {

    const name =
      songs[index].name.toLowerCase();

    item.style.display =
      name.includes(query)
        ? "flex"
        : "none";

  });

}

function toggleFavorite(index) {

  const song = songs[index];

  if (!song) return;

  const name = song.name;

  if (favorites.includes(name)) {

    favorites =
      favorites.filter(item => item !== name);

  } else {

    favorites.push(name);

  }

  localStorage.setItem(
    "nerbertFavorites",
    JSON.stringify(favorites)
  );

  loadSongs();

}

function playSong(index) {

  if (!songs[index]) return;

  currentIndex = index;

  audio.src = songs[index].url;

  audio.play();

  document.getElementById("playerTitle")
    .textContent = songs[index].name;

  document.getElementById("playButton")
    .textContent = "⏸";

  highlightSong();

}

function togglePlay() {

  if (currentIndex === -1) {

    if (songs.length > 0) {
      playSong(0);
    }

    return;
  }

  if (audio.paused) {

    audio.play();

    document.getElementById("playButton")
      .textContent = "⏸";

  } else {

    audio.pause();

    document.getElementById("playButton")
      .textContent = "▶";

  }

}

function previousSong() {

  if (songs.length === 0) return;

  if (currentIndex <= 0) {

    currentIndex =
      songs.length - 1;

  } else {

    currentIndex--;

  }

  playSong(currentIndex);

}

function nextSong() {

  if (songs.length === 0) return;

  if (shuffle && songs.length > 1) {

    let newIndex;

    do {
      newIndex =
        Math.floor(Math.random() * songs.length);
    } while (newIndex === currentIndex);

    currentIndex = newIndex;

  } else {

    if (currentIndex >= songs.length - 1) {
      currentIndex = 0;
    } else {
      currentIndex++;
    }

  }

  playSong(currentIndex);
}

function highlightSong() {

  const items =
    document.querySelectorAll(".song");

  items.forEach((item, index) => {

    if (index === currentIndex) {

      item.classList.add("active");

    } else {

      item.classList.remove("active");

    }

  });

}

async function uploadSong() {

  const fileInput =
    document.getElementById("songFile");

  const message =
    document.getElementById("message");

  if (!fileInput.files.length) {

    message.textContent =
      "Choose a song first.";

    return;
  }

  const formData =
    new FormData();

  formData.append(
    "song",
    fileInput.files[0]
  );

  message.textContent =
    "Uploading...";

  try {

    const response =
      await fetch("http://10.184.232.166:3000/upload", {
        method: "POST",
        body: formData
      });

    const result =
      await response.json();

    message.textContent =
      result.message || result.error;

    fileInput.value = "";

    await loadSongs();

  } catch (error) {

    message.textContent =
      "Upload failed.";

  }

}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

loadSongs();

</script>

</body>
</html>
