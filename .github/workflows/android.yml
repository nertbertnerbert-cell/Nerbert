name: Build Nerbert Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          echo "Gradle exit code: $RESULT"
          echo "=== APK SEARCH ==="
          find . -type f -name "*.apk" -print
          exit $RESULT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nerbert-music-debug
          path: android/app/build/outputs/**/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nerbert-music-build-log
          path: android/build.log
